<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Database Simulator</title>
    <link rel="stylesheet" href="home_styles.css">

    <style>
        body {
            display: flex;
            place-items: center;
            justify-content: center;
        }

        .tab {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Default auto margins keep an hr from stretching in a flex column */
        .tab hr {
            margin-inline: 0;
            width: 100%;
        }

        .message {
            padding: 8px 12px;
            border: 1px solid;
            border-radius: 4px;
        }

        .message.error {
            color: #8a1c1c;
            background: #fdecec;
            border-color: #e5a3a3;
        }

        .message.success {
            color: #1d5c2e;
            background: #e9f7ee;
            border-color: #9fd3b0;
        }

        /* 300 accounts is too tall for the page, so the table scrolls */
        .accounts-display,
        .report-display {
            max-height: 400px;
            overflow-y: auto;
        }

        /* Keep the column names visible while the rows scroll under them */
        .accounts-display th,
        .report-display th {
            position: sticky;
            top: 0;
            background: Canvas;
        }

        .report-display th,
        .report-display td {
            padding: 6px 12px;
        }

        .display-none {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Supermarket Database Simulator </h1>

        <!-- **************************************************
        // Tabs
        *************************************************** -->
        <div id="tab-switcher">
            <button id="customer-tab-btn">
                Customer Checkout
            </button>
            <button id="backend-tab-btn">
                Supermarket Backend
            </button>
            <button id="bank-tab-btn">
                Bank
            </button>
        </div>

        <div class="content">

            <!-- **************************************************
            // Customer Checkout 
            *************************************************** -->
            <div id="customer-tab" class="tab">
                <h2>Customer Checkout</h2>

                <hr>

                <label>
                    Choose Store:
                    <select name="" id="location-select"></select>
                </label>

                <label>
                    Choose Item:
                    <select name="" id="item-select"></select>
                </label>

                <label>
                    <span id="quantity-label">Quantity:</span>
                    <input type="number" id="quantity-input" min="1" step="1" value="1">
                    <button id="add-to-cart">Add To Cart</button>
                </label>

                <hr>

                <div id="cart-display" class="cart-display"></div>

                <hr>

                <label>
                    Payment Method:
                    <select id="payment-method-input">
                        <option value="card">Card</option>
                        <option value="cash">Cash</option>
                    </select>
                </label>

                <label id="account-num-label">
                    Account Number:
                    <input type="text" id="account-num-input">
                </label>

                <button id="checkout-btn">Checkout</button>
                <button id="simulate-btn">Simulate Random Checkout</button>

                <div id="message-box" class="message display-none"></div>
            </div>
    
            <!-- **************************************************
            // Supermarket Backend
            *************************************************** -->
            <div id="backend-tab" class="tab display-none"> 

                <h2>Backend</h2>

                <button id="reset-btn">Reset Supermarket Tables</button>
                <div id="backend-message-box" class="message display-none"></div>

                <hr>

                <h3>Reports</h3>

                <div id="report-btns">
                    <button id="monthly-sales-btn" data-report="monthlySales">Monthly Sales Report</button>
                    <button id="top-sales-btn">Top Sales By Department</button>
                </div>
                
                <div id="report-title"></div>
                    
                <div id="report-display" class="report-display"></div>
            </div>

            <!-- **************************************************
            // Bank
            *************************************************** -->
            <div id="bank-tab" class="tab display-none">
                <h2>Bank</h2>

                <hr>

                <div id="accounts-display" class="accounts-display"></div>

                <hr>

                <button id="bank-reset-btn">Reset Bank Tables</button>

                <div id="bank-message-box" class="message display-none"></div>
            </div>
        </div>
    </div>
</body>

<script>

    // ------------------------------------------------------------------------------
    // Nodes
    // ------------------------------------------------------------------------------
    let backendTab = document.getElementById("backend-tab");
    let customerTab = document.getElementById("customer-tab");
    let bankTab = document.getElementById("bank-tab");

    let backendTabBtn = document.getElementById("backend-tab-btn");
    let customerTabBtn = document.getElementById("customer-tab-btn");
    let bankTabBtn = document.getElementById("bank-tab-btn");

    let locationSelect = document.getElementById("location-select");
    let itemSelect = document.getElementById("item-select");
    let quantityLabel = document.getElementById("quantity-label");
    let quantityInput = document.getElementById("quantity-input");
    let addToCartBtn = document.getElementById("add-to-cart");
    let cartDisplay = document.getElementById("cart-display");
    let paymentMethodInput = document.getElementById("payment-method-input");
    let accountNumLabel = document.getElementById("account-num-label");
    let accountNumInput = document.getElementById("account-num-input");
    let checkoutBtn = document.getElementById("checkout-btn");
    let messageBox = document.getElementById("message-box");

    let resetBtn = document.getElementById("reset-btn");
    let simulateBtn = document.getElementById("simulate-btn");
    let backendMessageBox = document.getElementById("backend-message-box");

    let bankResetBtn = document.getElementById("bank-reset-btn");
    let bankMessageBox = document.getElementById("bank-message-box");
    let accountsDisplay = document.getElementById("accounts-display");

    let reportTitle = document.getElementById("report-title");
    let reportDisplay = document.getElementById("report-display");

    // ------------------------------------------------------------------------------
    // State 
    // ------------------------------------------------------------------------------
    let locations = [];
    let inventory = [];
    let cart = [];

    // ------------------------------------------------------------------------------
    // Setup
    // ------------------------------------------------------------------------------
    loadStores();

    // ------------------------------------------------------------------------------
    // Tab Switching
    // ------------------------------------------------------------------------------
    backendTabBtn.addEventListener("click", () => switchTab(backendTab));
    customerTabBtn.addEventListener("click", () => switchTab(customerTab));
    // Balances change with every card checkout, so reload them each time the tab opens
    bankTabBtn.addEventListener("click", () => {
        switchTab(bankTab);
        loadAccounts();
    });

    function switchTab(tab) {
        [customerTab, backendTab, bankTab].forEach(hide);
        show(tab);
    }

    // ------------------------------------------------------------------------------
    // Select Store and Items
    // ------------------------------------------------------------------------------
    async function loadStores() {
        try {
            const data = await postJSON('stores');
            if (!data.success) throw new Error(data.message);

            setLocationSelect(data.stores);
            cart = [];
            renderCart();
            await loadItems();

        } catch (error) {
            console.error(error);
            showMessage(`Could not load stores: ${error.message}. Try Refresh Tables on the backend tab.`);
        }
    }

    // Inventory is per store, so switching stores empties the cart
    locationSelect.addEventListener('change', () => {
        cart = [];
        renderCart();
        loadItems();
    });

    async function loadItems() {
        try {
            const data = await postJSON('inventory', { storeID: Number(locationSelect.value) });
            if (!data.success) throw new Error(data.message);
            setItemSelect(data.items);

        } catch (error) {
            console.error(error);
        }
    }

    function setItemSelect(data) {
        inventory = Array.from(data);

        let options = inventory.map(item => new Option(
            `${item.name} - $${item.price}${item.priced_by_weight ? '/lb' : ''}`,
            item.sku
        ));

        itemSelect.replaceChildren(...options);
        setQuantityInput();
    }

    itemSelect.addEventListener('change', () => setQuantityInput());

    // Weighed items take up to 3 decimals; counted items take whole numbers
    function setQuantityInput() {
        const item = inventory.find(i => i.sku === itemSelect.value);
        const byWeight = item?.priced_by_weight ?? false;

        quantityLabel.textContent = byWeight ? 'Weight (lb):' : 'Quantity:';
        quantityInput.step = byWeight ? '0.001' : '1';
        quantityInput.min = byWeight ? '0.001' : '1';
        quantityInput.value = 1;
    }

    // ------------------------------------------------------------------------------
    // Cart
    // ------------------------------------------------------------------------------
    addToCartBtn.addEventListener('click', () => addToCart());

    function addToCart() {
        const item = inventory.find(i => i.sku === itemSelect.value);
        const quantity = Number(quantityInput.value);

        if (!item) return;
        if (!quantityInput.checkValidity() || quantity <= 0) {
            showMessage(item.priced_by_weight
                ? 'Enter a weight greater than 0 with at most 3 decimals.'
                : 'Enter a whole-number quantity of at least 1.');
            return;
        }

        const existing = cart.find(c => c.sku === item.sku);
        const newQuantity = round((existing?.quantity ?? 0) + quantity, 3);

        if (newQuantity > Number(item.quantity_in_stock)) {
            showMessage(`Only ${Number(item.quantity_in_stock)} of ${item.name} in stock.`);
            return;
        }

        clearMessage();

        if (existing) {
            existing.quantity = newQuantity;
        } else {
            cart.push({
                sku: item.sku,
                name: item.name,
                price: Number(item.price),
                pricedByWeight: item.priced_by_weight,
                quantity: newQuantity,
            });
        }

        renderCart();
    }

    function removeFromCart(sku) {
        cart = cart.filter(c => c.sku !== sku);
        renderCart();
    }

    function renderCart() {
        if (cart.length === 0) {
            cartDisplay.replaceChildren('Cart is empty.');
            return;
        }

        const table = document.createElement('table');
        table.innerHTML = `
            <thead>
                <tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th></tr>
            </thead>
        `;

        const tbody = document.createElement('tbody');
        for (const c of cart) {
            const row = document.createElement('tr');
            const unit = c.pricedByWeight ? '/lb' : '';

            [
                c.name,
                c.pricedByWeight ? `${c.quantity} lb` : c.quantity,
                `$${c.price.toFixed(2)}${unit}`,
                `$${(c.price * c.quantity).toFixed(2)}`,
            ].forEach(text => {
                const td = document.createElement('td');
                td.textContent = text;
                row.appendChild(td);
            });

            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', _ => removeFromCart(c.sku));
            const td = document.createElement('td');
            td.appendChild(removeBtn);
            row.appendChild(td);

            tbody.appendChild(row);
        }
        table.appendChild(tbody);

        const subtotal = cart.reduce((sum, c) => sum + c.price * c.quantity, 0);
        const subtotalLine = document.createElement('p');
        subtotalLine.textContent = `Subtotal (before tax): $${subtotal.toFixed(2)}`;

        cartDisplay.replaceChildren(table, subtotalLine);
    }

    // ------------------------------------------------------------------------------
    // Checkout
    // ------------------------------------------------------------------------------
    // Only card payments need an account number
    paymentMethodInput.addEventListener("change", () => setAccountNumVisibility());
    setAccountNumVisibility();

    function setAccountNumVisibility() {
        if (paymentMethodInput.value === "card") {
            show(accountNumLabel);
        } else {
            hide(accountNumLabel);
            accountNumInput.value = "";
        }
    }

    checkoutBtn.addEventListener("click", () => checkout());

    async function checkout() {
        try {
            const data = await postJSON('test-transaction', {
                storeId: Number(locationSelect.value),
                items: cart,
                paymentMethod: paymentMethodInput.value,
                accountId: Number(accountNumInput.value)
            });

            // Validation failures come back as { error }, transaction failures as { success: false, message }
            if (data.error || !data.success) {
                throw new Error(data.error ?? data.message);
            }

            cart = [];
            renderCart();
            // Stock changed, so refresh the item list
            await loadItems();

            showMessage(
                `Transaction #${data.transactionId} complete. Total charged: $${data.total} (${data.paymentMethod}).`,
                'success'
            );

        } catch (error) {
            console.error(error);
            showMessage(`Checkout failed: ${error.message}`);
        }
    }

    // ------------------------------------------------------------------------------
    // Supermarket Reset
    // ------------------------------------------------------------------------------
    resetBtn.addEventListener("click", _ => resetDatabase());

    async function resetDatabase() {
        if (!confirm('This deletes all supermarket data and regenerates it. Continue?')) return;

        try {
            const data = await postJSON('reset-tables');
            if (!data.success) throw new Error(data.message);

            clearMessage();
            await loadStores();

            showMessage('Supermarket tables reset.', 'success', backendMessageBox);

        } catch (error) {
            console.error(error);
            showMessage(`Supermarket reset failed: ${error.message}`, 'error', backendMessageBox);
        }
    }

    // ------------------------------------------------------------------------------
    // Reports
    // ------------------------------------------------------------------------------
    // To add a report: add an entry here, a server endpoint that returns
    // { success, rows }, and a button with data-report="<key>"
    const money = n => `$${Number(n).toFixed(2)}`;

    const REPORTS = {
        monthlySales: {
            title: 'Monthly Sales',
            endpoint: 'reports/monthly-sales',
            columns: [
                ['Month', r => r.sales_month.slice(0, 7)],
                ['Store', r => `${r.street}, ${r.city}, ${r.state_code}, ${r.zip_code}`],
                ['Transactions', r => r.total_transactions],
                ['Revenue', r => money(r.total_revenue)],
                ['Avg Transaction', r => money(r.average_transaction)],
            ],
        },
    };

    document.querySelectorAll("[data-report]").forEach(btn =>
        btn.addEventListener("click", () => runReport(REPORTS[btn.dataset.report]))
    );

    async function runReport(report) {
        reportTitle.textContent = report.title;
        reportDisplay.replaceChildren('Loading...');

        try {
            const data = await postJSON(report.endpoint);
            if (!data.success) throw new Error(data.message);

            renderReport(report, data.rows);

        } catch (error) {
            console.error(error);
            reportDisplay.replaceChildren();
            showMessage(`${report.title} failed: ${error.message}`, 'error', backendMessageBox);
        }
    }

    function renderReport(report, rows) {
        if (rows.length === 0) {
            reportDisplay.replaceChildren('No data.');
            return;
        }

        const table = document.createElement('table');

        const headRow = document.createElement('tr');
        for (const [header] of report.columns) {
            const th = document.createElement('th');
            th.textContent = header;
            headRow.appendChild(th);
        }
        table.createTHead().appendChild(headRow);

        const tbody = document.createElement('tbody');
        for (const r of rows) {
            const row = document.createElement('tr');

            for (const [, value] of report.columns) {
                const td = document.createElement('td');
                td.textContent = value(r);
                row.appendChild(td);
            }
            tbody.appendChild(row);
        }
        table.appendChild(tbody);

        reportDisplay.replaceChildren(table);
    }

    // ------------------------------------------------------------------------------
    // Bank Reset
    // ------------------------------------------------------------------------------
    bankResetBtn.addEventListener("click", _ => resetBank());

    async function resetBank() {
        if (!confirm('This deletes all bank accounts and regenerates them. Continue?')) return;

        try {
            const data = await postJSON('reset-bank');
            if (!data.success) throw new Error(data.message);

            showMessage(`Bank tables refreshed: ${data.accountCount} accounts.`, 'success', bankMessageBox);
            await loadAccounts();

        } catch (error) {
            console.error(error);
            showMessage(`Bank refresh failed: ${error.message}`, 'error', bankMessageBox);
        }
    }

    // ------------------------------------------------------------------------------
    // Bank Accounts
    // ------------------------------------------------------------------------------
    async function loadAccounts() {
        try {
            const data = await postJSON('accounts');
            if (!data.success) throw new Error(data.message);
            renderAccounts(data.accounts);

        } catch (error) {
            console.error(error);
            accountsDisplay.replaceChildren();
            showMessage(`Could not load accounts: ${error.message}. Try Refresh Bank Tables.`, 'error', bankMessageBox);
        }
    }

    function renderAccounts(accounts) {
        if (accounts.length === 0) {
            accountsDisplay.replaceChildren('No bank accounts.');
            return;
        }

        const table = document.createElement('table');
        table.innerHTML = `
            <thead>
                <tr><th>Account Number</th><th>Balance</th></tr>
            </thead>
        `;

        const tbody = document.createElement('tbody');
        for (const a of accounts) {
            const row = document.createElement('tr');

            [
                a.account_number,
                `$${Number(a.balance).toFixed(2)}`,
            ].forEach(text => {
                const td = document.createElement('td');
                td.textContent = text;
                row.appendChild(td);
            });

            tbody.appendChild(row);
        }
        table.appendChild(tbody);

        accountsDisplay.replaceChildren(table);
    }

    // ------------------------------------------------------------------------------
    // Simulation
    // ------------------------------------------------------------------------------
    simulateBtn.addEventListener("click", () => simulateCheckout());

    // Checks out 10-20 random in-stock items from a random store,
    // paid by card from a random bank account 70% of the time, otherwise cash
    async function simulateCheckout() {
        try {
            const store = locations[randomInt(0, locations.length - 1)];
            if (!store) throw new Error('No stores loaded');

            const data = await postJSON('inventory', { storeID: store.store_id });
            if (!data.success) throw new Error(data.message);

            const inStock = data.items.filter(i => Number(i.quantity_in_stock) >= (i.priced_by_weight ? 0.001 : 1));
            const count = Math.min(randomInt(10, 20), inStock.length);
            if (count === 0) throw new Error('Store has no items in stock');

            const items = shuffle(inStock).slice(0, count).map(i => {
                const stock = Number(i.quantity_in_stock);
                const quantity = i.priced_by_weight
                    ? Math.min(round(randomInt(100, 3000) / 1000, 3), stock)  // 0.1 - 3 lb
                    : randomInt(1, Math.min(5, Math.floor(stock)));
                return { sku: i.sku, name: i.name, quantity };
            });

            let paymentMethod = 'cash';
            let accountId;
            if (Math.random() < 0.7) {
                const bank = await postJSON('accounts');
                if (!bank.success) throw new Error(bank.message);
                if (bank.accounts.length === 0) throw new Error('No bank accounts');

                paymentMethod = 'card';
                accountId = bank.accounts[randomInt(0, bank.accounts.length - 1)].account_number;
            }
            const payment = paymentMethod === 'card' ? `card, account ${accountId}` : 'cash';

            const result = await postJSON('test-transaction', {
                storeId: store.store_id,
                items: items.map(({ sku, quantity }) => ({ sku, quantity })),
                paymentMethod,
                accountId,
            });

            if (result.error || !result.success) {
                throw new Error(`${result.error ?? result.message} (${payment})`);
            }

            console.table(items);
            showMessage(
                `Transaction #${result.transactionId} at ${store.street}, ${store.city}: ` +
                `${items.length} items, total $${result.total} (${payment}).`,
                'success'
            );

            // Stock changed, so refresh the checkout tab's item list
            await loadItems();

        } catch (error) {
            console.error(error);
            showMessage(`Simulation failed: ${error.message}`);
        }
    }

    function setLocationSelect(data) {
        locations = Array.from(data);

        let options = locations.map(store => new Option(
            `${store.street}, ${store.city}, ${store.state_code}, ${store.zip_code}`, 
            store.store_id
        ));

        locationSelect.replaceChildren(...options);
    }

    // ------------------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------------------
    function hide(node) {
        node.classList.add("display-none");
    }

    function show(node) {
        node.classList.remove("display-none");
    }

    function showMessage(text, type = 'error', box = messageBox) {
        box.textContent = text;
        box.classList.remove('error', 'success');
        box.classList.add(type);
        show(box);
    }

    // Inclusive on both ends
    function randomInt(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
    }

    // Fisher-Yates shuffle on a copy
    function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = randomInt(0, i);
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function clearMessage() {
        hide(messageBox);
    }

    function round(value, decimals) {
        const factor = 10 ** decimals;
        return Math.round(value * factor) / factor;
    }

    async function postJSON(endpoint, body = {}) {
        const response = await fetch(`http://localhost:3000/${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        return await response.json();
    }
</script>
</html>
